name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm install
      - run: npm test
      - run: python implementations/python/run_conformance.py
      - run: python -m unittest discover -s implementations/python -p "test_*.py"
      - run: npm run build:viewer
      - run: npm run package:viewer
      - run: npm run build:studio
      - run: npm run build:obsidian
      - run: npm run package:obsidian
      - run: npm run build:style-demo
      - run: npm run package:smoke
      - run: node src/cli.js validate artifacts/mdocss-style-demo.mdocss
      - run: npm run validate:example

      - uses: actions/upload-artifact@v4
        with:
          name: mdocss-runtime-smoke-${{ github.sha }}
          path: |
            artifacts/mdocss-obsidian-*.zip
            artifacts/mdocss-reference-viewer.zip
            artifacts/DocumentOne.html
            artifacts/mdocss-style-demo.mdocss
            artifacts/mdocss-smoke-kit.zip
          if-no-files-found: error

  browser-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MDOCSS_PLAYWRIGHT_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: google-chrome --version
      - run: npm run build:viewer
      - run: npm run build:studio
      - run: npm run build:style-demo
      - run: npm run test:browser-runtime
      - run: npm run test:studio-runtime
