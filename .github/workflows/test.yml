name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - run: npm run build:viewer
      - run: npm run package:viewer
      - run: npm run build:obsidian
      - run: npm run package:obsidian
      - run: npm run build:style-demo
      - run: node src/cli.js validate artifacts/mdocss-style-demo.mdocss
      - run: npm run validate:example

      - uses: actions/upload-artifact@v4
        with:
          name: mdocss-obsidian-${{ github.sha }}
          path: artifacts/mdocss-obsidian-*.zip
          if-no-files-found: error
